<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증서 발급 센터</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
<main>
    <header>
        <h1>인증서 발급 센터</h1>
    </header>

    <form id="certificate-form" class="card" novalidate>
        <fieldset class="purpose">
            <legend>1. 인증서 용도 선택</legend>
            <label class="purpose-option">
                <input type="radio" name="purpose" value="wpa3">
                <span class="purpose-title">Wi-Fi (WPA3 Enterprise)</span>
                <span class="purpose-hint">회사·집 무선 네트워크 접속용</span>
            </label>
            <label class="purpose-option">
                <input type="radio" name="purpose" value="vpn">
                <span class="purpose-title">VPN</span>
                <span class="purpose-hint">외부에서 내부망에 접속할 때 사용</span>
            </label>
        </fieldset>

        <section id="vpn-ca-step" class="step" hidden>
            <h2>2. VPN CA 설치</h2>
            <a class="button secondary" href="/api/vpn/ca-certificate" download="vpn-ca-certificate.crt">VPN CA 다운로드</a>
        </section>

        <section id="details-step" class="step" hidden>
            <h2 id="details-title">2. 기기 정보 입력</h2>

            <div class="form-group">
                <label for="common-name">기기 이름</label>
                <input id="common-name" name="commonName" type="text" placeholder="예: notebook-01"
                       maxlength="253" pattern="[A-Za-z0-9.\-]+" autocomplete="off" autocapitalize="off"
                       spellcheck="false" required aria-describedby="common-name-hint">
                <small id="common-name-hint">영문자, 숫자, 점, 하이픈만 사용할 수 있습니다.</small>
            </div>

            <div class="password-pair">
                <div class="form-group">
                    <label for="p12-password">인증서 가져오기 비밀번호</label>
                    <div class="password-row">
                        <input id="p12-password" name="p12Password" type="password" minlength="8" maxlength="128"
                               autocomplete="new-password" required aria-describedby="p12-password-hint">
                        <button class="toggle" type="button" aria-controls="p12-password">표시</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="p12-password-confirm">비밀번호 확인</label>
                    <div class="password-row">
                        <input id="p12-password-confirm" name="p12PasswordConfirm" type="password" minlength="8"
                               maxlength="128" autocomplete="new-password" required>
                        <button class="toggle" type="button" aria-controls="p12-password-confirm">표시</button>
                    </div>
                </div>

                <small id="p12-password-hint" class="pair-hint">8~128자. 기기에 인증서를 설치할 때 다시 입력합니다.</small>
            </div>

            <button id="issue-button" class="button primary" type="submit">인증서 발급 및 다운로드</button>
        </section>

        <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
</main>
</body>
</html>
