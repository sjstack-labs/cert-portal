<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증서 발급 센터</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 1rem; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>인증서 발급 요청</h1>
        <div class="form-group">
            <label for="commonName">기기 이름 (Common Name)</label>
            <input type="text" id="commonName" placeholder="예: my-device-01">
        </div>
        <div class="form-group">
            <label for="p12Password">인증서 가져오기 비밀번호 (8자 이상)</label>
            <input type="password" id="p12Password" minlength="8" maxlength="128" autocomplete="new-password">
        </div>
        <button onclick="requestCertificate()">인증서 발급 및 다운로드</button>
        <div id="status"></div>
    </div>

    <script>
        async function requestCertificate() {
            const commonName = document.getElementById('commonName').value;
            const p12Password = document.getElementById('p12Password').value;
            const statusDiv = document.getElementById('status');

            if (!commonName) {
                alert("기기 이름을 입력해주세요.");
                return;
            }
            if (p12Password.length < 8 || p12Password.length > 128) {
                alert("인증서 가져오기 비밀번호를 8~128자로 입력해주세요.");
                return;
            }

            statusDiv.innerText = "step-ca에 인증서 발급 요청 중...";
            statusDiv.style.color = "blue";

            try {
                const response = await fetch('/api/request-cert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ common_name: commonName, p12_password: p12Password })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${commonName.replace(/\s+/g, '_')}.pfx`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    statusDiv.innerText = "발급 완료! Windows/Android용 PFX 다운로드가 시작되었습니다.";
                    statusDiv.style.color = "green";
                } else {
                    const errorText = await response.text();
                    statusDiv.innerText = `실패: ${errorText}`;
                    statusDiv.style.color = "red";
                }
            } catch (error) {
                statusDiv.innerText = `오류 발생: ${error.message}`;
                statusDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
